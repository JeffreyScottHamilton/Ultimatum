name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      # uv provides Python versions that setup-python no longer ships, e.g. 3.9.
      - uses: astral-sh/setup-uv@v6
      - name: Toolbelt unit tests
        # Runners have no ripgrep, so this also covers ult search's pure-Python fallback.
        # Browser tests skip themselves when Playwright is not installed.
        run: uv run --python ${{ matrix.python }} --no-project python -m unittest discover -s plugins/ultimatum/tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff (real-bug rules from ruff.toml)
        run: uvx ruff@0.16.9 check .

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI (no credentials needed for validate)
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Validate plugin
        run: claude plugin validate plugins/ultimatum --strict
      - name: Validate head plugins
        run: |
          for d in plugins/ultimatum-*/; do
            claude plugin validate "${d%/}" --strict
          done
      - name: Head plugins match teams/ and the core toolbelt
        run: python3 tools/sync_plugins.py --check

  version-bump:
    # Installs only update when the manifest version changes, so a plugin change
    # without a bump would never reach users (auto-update compares versions).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plugin changes bump the version and the changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- plugins/ultimatum; then echo "plugin unchanged"; exit 0; fi
          old=$(git show "$BASE:plugins/ultimatum/.claude-plugin/plugin.json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          new=$(python3 -c 'import json;print(json.load(open("plugins/ultimatum/.claude-plugin/plugin.json"))["version"])')
          echo "version $old -> $new"
          test "$old" != "$new" || { echo "::error::plugins/ultimatum changed but version was not bumped"; exit 1; }
          grep -qF "## [$new]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $new"; exit 1; }
      - name: Head plugin changes bump their version and the changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          fail=0
          for dir in plugins/ultimatum-*; do
            label="${dir#plugins/ultimatum-}"
            if git diff --quiet "$BASE" HEAD -- "$dir"; then echo "$label unchanged"; continue; fi
            new=$(python3 -c "import json;print(json.load(open('$dir/.claude-plugin/plugin.json'))['version'])")
            if old=$(git show "$BASE:$dir/.claude-plugin/plugin.json" 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])' 2>/dev/null); then
              echo "$label version $old -> $new"
              test "$old" != "$new" || { echo "::error::$dir changed but version was not bumped"; fail=1; }
            fi
            grep -qF -e "## [$label $new]" -e "## [$new]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $label $new"; fail=1; }
          done
          exit $fail
