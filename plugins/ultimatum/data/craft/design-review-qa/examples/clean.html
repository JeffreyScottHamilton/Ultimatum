<!doctype html>
<html><head><title>Northline Bikes</title>
<style>
:root { --ink: #1a2421; --paper: #f1f5f2; --accent: #2d6a4f; --font-display: "Fraunces", Georgia, serif; }
body { font-family: var(--font-display); color: var(--ink); background: var(--paper); }
h1 { font-size: 56px; overflow-wrap: anywhere; }
h2 { font-size: 32px; }
.btn { border-radius: 4px; color: var(--paper); background: var(--accent); }
.btn:active { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { border-radius: 10px; }
</style></head>
<body>
<h1>Bike repairs in Leeds, done the same day</h1>
<p>Drop your bike off before 10am and collect it after 5pm. Fixed prices on the board.</p>
<a class="btn" href="/book">Book a repair slot</a>
<img src="/shop.jpg" alt="The workshop on Kirkgate">
<img src="/divider.svg" alt="">
</body></html>
