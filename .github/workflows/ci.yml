name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      # uv provides Python versions that setup-python no longer ships, e.g. 3.9.
      - uses: astral-sh/setup-uv@v6
      - name: Toolbelt unit tests
        # Runners have no ripgrep, so this also covers ult search's pure-Python fallback.
        # Browser tests skip themselves when Playwright is not installed.
        run: uv run --python ${{ matrix.python }} --no-project python -m unittest discover -s plugins/ultimatum/tests -v

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI (no credentials needed for validate)
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Validate plugin
        run: claude plugin validate plugins/ultimatum --strict
